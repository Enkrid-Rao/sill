# Sill 安装包 / 绿色版配置。规格与验收见 DEVPLAN §11。
# 自动更新用 electron-updater：NSIS 安装版走 GitHub Releases；
# 绿色 ZIP 不参与自动更新，见 paths.ts 的 IS_PORTABLE。

appId: com.sill.app
productName: Sill
copyright: Copyright © 2026 raoxi

publish:
  provider: github
  owner: Enkrid-Rao
  repo: sill

directories:
  output: dist
  buildResources: resources

# 只打构建产物。React 已被 Vite 打进 renderer bundle，运行时没有额外 node_modules 依赖。
files:
  - out/**/*
  - "!out/smoke.png"
  - "!out/desktop*.png"
  - "!out/*.png"
  - "!out/*.webp"
  - "!out/*.jpg"
  - "!out/*.mjs"
  - "!out/*.log"
  - "!out/shots*/**"
  - package.json

# 托盘图标放在 asar 外面：nativeImage 读 asar 内的文件不可靠。
# paths.ts 在打包态用 process.resourcesPath/resources 找它们。
extraResources:
  - from: resources
    to: resources
    filter:
      - "*.ico"
      - "*.png"
      - "*.ps1"
  # 组件脚手架：设置里的「新建组件」和 CLI 共用同一份模板
  - from: ../../packages/cli/templates
    to: templates

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  # 256×256，由 scripts/make-tray-icon.py 生成，和托盘图标同源
  icon: resources/app-icon.png

nsis:
  artifactName: Sill-Setup-${version}.${ext}
  oneClick: false                     # 向导式，用户能选安装目录
  perMachine: false                   # 装进 %LOCALAPPDATA%\Programs\Sill，不弹 UAC
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false        # 托盘应用，桌面不放图标
  createStartMenuShortcut: true
  shortcutName: Sill
  uninstallDisplayName: Sill
  deleteAppDataOnUninstall: false     # 默认保留 %APPDATA%\Sill；设置内卸载可带 --delete-app-data
  runAfterFinish: true
  include: sill-file-assoc.nsh         # 注册当前用户级 .sill 关联（右键 / 双击安装组件）

<div class="sys" id="sys">
  <div class="sys__head">
    <span class="sys__title" data-sill-i18n="title">SYSTEM</span>
    <span class="sys__cores">
      <span data-sill-text="cpu.cores">--</span>
      <span data-sill-i18n="cores">cores</span>
    </span>
  </div>

  <div class="sys__row">
    <span class="sys__label">CPU</span>
    <span class="sys__value" id="cpu">--</span>
    <div
      class="sys__bar"
      id="cpuBar"
      role="progressbar"
      aria-label="CPU"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <i data-sill-meter="cpu.usage"></i>
    </div>
  </div>

  <div class="sys__row">
    <span class="sys__label" id="memLabel" data-sill-i18n="mem">RAM</span>
    <span class="sys__value" id="mem">--</span>
    <div
      class="sys__bar"
      id="memBar"
      role="progressbar"
      aria-labelledby="memLabel"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <i data-sill-meter="mem.percent"></i>
    </div>
  </div>

  <div class="sys__row">
    <span class="sys__label" data-sill-i18n="gpu">GPU</span>
    <span class="sys__value" id="gpu">--</span>
    <div
      class="sys__bar sys__bar--warm"
      id="gpuBar"
      role="progressbar"
      aria-label="GPU"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <i data-sill-meter="gpu.usage"></i>
    </div>
  </div>

  <div class="sys__row sys__row--plain">
    <span class="sys__label" data-sill-i18n="net">NETWORK</span>
    <span class="sys__value" id="net">--</span>
  </div>

  <div class="sys__hint" id="hint" hidden>
    <span id="hintSampling" data-sill-i18n="sampling">正在采样…</span>
    <span id="hintStalled" data-sill-i18n="stalled" hidden></span>
  </div>
</div>
